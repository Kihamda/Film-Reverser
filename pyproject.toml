[project]
name = "film-reverser"
version = "0.1.0"
description = "Convert 135mm film negative scans to positive images (Tkinter GUI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rawpy>=0.22.0",
    "Pillow>=10.0.0",
    "numpy>=1.20.0",
    "opencv-python-headless>=4.5.0",
]

[project.scripts]
film-reverser = "film_reverser:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["film_reverser.py"]
